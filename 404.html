<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Rahul Kumar</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px var(--container-x);
      text-align: center;
      background:
        radial-gradient(60% 60% at 50% 30%, rgba(34,211,238,0.10), transparent 60%),
        var(--bg);
    }
    .nf-inner { max-width: 520px; }
    .nf-code {
      font-family: var(--mono);
      font-size: 80px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 18px;
    }
    .nf-title { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 14px; }
    .nf-text { color: var(--text-dim); margin-bottom: 30px; }
  </style>
</head>
<body>
  <div class="nf-wrap">
    <div class="nf-inner">
      <div class="nf-code">404</div>
      <h1 class="nf-title">Page not found</h1>
      <p class="nf-text">The page you're looking for doesn't exist or has been moved.</p>
      <a href="/" class="btn btn-primary">Back to home</a>
    </div>
  </div>
</body>
</html>
