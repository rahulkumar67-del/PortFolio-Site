<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Details — Rahul Kumar</title>
  <meta name="description" content="Detailed project case study by Rahul Kumar." />
  <meta name="theme-color" content="#0a0f1a" />

  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://kit.fontawesome.com/a4f0267e44.js" crossorigin="anonymous" defer></script>

  <style>
    body { background: var(--bg); color: var(--text); font-family: var(--font); }
    .project-page { max-width: 1100px; margin: 0 auto; padding: 60px var(--container-x); }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 36px;
      padding: 11px 22px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all .2s;
    }
    .back-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); transform: translateX(-4px); }

    .project-header, .project-body, .project-footer {
      background: var(--surface);
      padding: 32px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .project-header h1 {
      font-size: clamp(28px, 4vw, 40px);
      margin: 0 0 14px;
      color: var(--text);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .project-tags { margin: 14px 0; display: flex; gap: 8px; flex-wrap: wrap; }
    .tag {
      display: inline-block;
      background: var(--accent-soft);
      border: 1px solid rgba(34,211,238,0.3);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      font-family: var(--mono);
    }
    .project-meta {
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-dim);
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    .project-meta i { color: var(--accent); margin-right: 6px; }

    .project-body h2 {
      font-size: 22px;
      margin-bottom: 16px;
      color: var(--text);
      font-weight: 600;
    }
    .project-body p {
      line-height: 1.7;
      margin-bottom: 22px;
      color: var(--text-dim);
      font-size: 15.5px;
    }
    .video-container {
      max-width: 100%;
      margin: 0 auto 24px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .video-container iframe,
    .video-container video {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #051018;
      border: 0;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-weight: 600;
      transition: transform .2s, box-shadow .2s;
    }
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--accent-glow);
      color: #051018;
    }

    .project-footer h3 { font-size: 18px; margin-bottom: 14px; color: var(--text); font-weight: 600; }
    .project-footer ul { padding: 0; margin: 0; }
    .project-footer ul li {
      margin: 10px 0;
      font-size: 15px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .project-footer ul li i { color: var(--accent); }
    .project-footer ul li a { color: var(--accent); word-break: break-all; }
  </style>
</head>
<body>
  <div class="project-page">
    <a href="index.html#portfolio" class="back-btn">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Portfolio
    </a>

    <div class="project-header" id="project-header"></div>
    <div class="project-body" id="project-body"></div>
    <div class="project-footer" id="project-footer"></div>
  </div>

  <script src="js/projects.js" defer></script>
</body>
</html>
