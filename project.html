<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case study — Aerovant</title>
  <meta name="description" content="Case study — Aerovant, simulation and XR engineering studio." />
  <meta name="theme-color" content="#0B0F14" />

  <link rel="icon" href="images/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    .case-nav {
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(8px);
    }
    .case-nav .container {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 16px; padding-bottom: 16px; gap: 16px;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-dim); font-size: 14.5px; font-weight: 500;
    }
    .back-btn:hover { color: var(--accent); }

    .case { padding: 56px 0 90px; }
    .case-head { max-width: 780px; margin-bottom: 40px; }
    .case-head h1 {
      font-family: var(--f-display);
      font-size: clamp(30px, 5vw, 50px);
      font-weight: 800; letter-spacing: -0.032em;
      line-height: 1.05; margin: 12px 0 18px;
      text-wrap: balance;
    }
    .case-summary { font-size: clamp(16px, 1.6vw, 19px); color: var(--text-dim); }

    .case-hero {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden; margin-bottom: 44px;
      background: var(--surface);
    }
    .case-hero picture { display: block; }
    .case-hero img { width: 100%; height: auto; aspect-ratio: 16/9; object-fit: contain; background: var(--bg); }

    .case-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0; margin-bottom: 44px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .case-meta div { padding: 18px 20px 18px 0; }
    .case-meta div + div { padding-left: 20px; border-left: 1px solid var(--border); }
    .case-meta dt {
      font-family: var(--f-mono); font-size: 10.5px; font-weight: 500;
      letter-spacing: 0.13em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 5px;
    }
    .case-meta dd { font-size: 15px; color: var(--text); font-weight: 500; }

    .case-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
      gap: 56px; align-items: start;
    }
    .case-body h2 {
      font-family: var(--f-display);
      font-size: 22px; font-weight: 700;
      letter-spacing: -0.018em; color: var(--text);
      margin: 38px 0 14px;
    }
    .case-body h2:first-child { margin-top: 0; }
    .case-body p { color: var(--text-dim); font-size: 16px; line-height: 1.75; max-width: 68ch; }

    .case-aside { display: flex; flex-direction: column; gap: 30px; position: sticky; top: 84px; }
    .aside-block h3 {
      font-family: var(--f-mono); font-size: 11px; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--muted); padding-bottom: 10px;
      border-bottom: 1px solid var(--border); margin-bottom: 14px;
    }
    .aside-block ul { display: flex; flex-direction: column; gap: 10px; }
    .aside-block li {
      color: var(--text-dim); font-size: 14.5px; line-height: 1.5;
      padding-left: 16px; position: relative;
    }
    .aside-block li::before {
      content: ''; position: absolute; left: 0; top: 8px;
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    }
    .aside-tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .aside-tags li {
      font-family: var(--f-mono); font-size: 11px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted); padding: 4px 9px;
      border: 1px solid var(--border); border-radius: 3px;
    }
    .aside-tags li::before { display: none; }
    .aside-tags li { padding-left: 9px; }

    .video-frame {
      margin: 34px 0; border-radius: var(--radius);
      overflow: hidden; border: 1px solid var(--border);
      aspect-ratio: 16/9; background: #000;
    }
    .video-frame iframe { width: 100%; height: 100%; border: 0; display: block; }

    .case-foot {
      margin-top: 60px; padding-top: 34px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      gap: 18px; flex-wrap: wrap;
    }
    .case-foot p { color: var(--text-dim); font-size: 15.5px; }

    @media (max-width: 940px) {
      .case-layout { grid-template-columns: 1fr; gap: 38px; }
      .case-aside { position: static; }
      .case-meta div + div { padding-left: 0; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>

  <div class="case-nav">
    <div class="container">
      <a href="index.html" class="brand" aria-label="Aerovant — home">
        <svg class="brand-mark sm" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
          <rect width="512" height="512" rx="113" fill="#E8A33D"/>
          <path d="M256 132 L378 344 L256 292 L134 344 Z" fill="#0B0F14"/>
          <rect x="134" y="386" width="244" height="22" rx="11" fill="#0B0F14"/>
        </svg>
        <span class="brand-word" style="font-size:17px">Aerovant</span>
      </a>
      <a href="index.html#work" class="back-btn">← All work</a>
    </div>
  </div>

  <div class="container case">
    <div id="case-root" aria-live="polite"></div>
  </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <svg class="brand-mark sm" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
          <rect width="512" height="512" rx="113" fill="#E8A33D"/>
          <path d="M256 132 L378 344 L256 292 L134 344 Z" fill="#0B0F14"/>
          <rect x="134" y="386" width="244" height="22" rx="11" fill="#0B0F14"/>
        </svg>
        <span>Aerovant</span>
      </div>
      <p class="footer-meta">Simulation &amp; XR engineering · Mandi, India · © <span id="year"></span></p>
      <a href="index.html" class="footer-top">Home</a>
    </div>
  </footer>

  <script src="js/projects.js" defer></script>
</body>
</html>
